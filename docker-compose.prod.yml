name: irish-rail-tracker

# Run on the server with --env-file /opt/irish-rail-tracker/.env.
# Each container keeps at most 3 x 10 MB of logs on the shared root disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    image: ghcr.io/dansom0/irish-rail-tracker:${IMAGE_TAG:-latest}
    logging: *logging
    restart: unless-stopped
    environment:
      STATION_CODES:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy
  worker:
    image: ghcr.io/dansom0/irish-rail-tracker:${IMAGE_TAG:-latest}
    logging: *logging
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      STATION_CODES:
      FETCH_INTERVAL_MINUTES: ${FETCH_INTERVAL_MINUTES:-5}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-15}
      # An unset override preserves the application's default API endpoint.
      IRISH_RAIL_API_URL:
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
