name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Check deployment configuration and scripts
        run: |
          docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet
          shellcheck scripts/*.sh

  test:
    name: Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: irishrail_test
          POSTGRES_USER: irishrail
          POSTGRES_PASSWORD: irishrail
        options: >-
          --health-cmd "pg_isready -U irishrail -d irishrail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgresql+psycopg://irishrail:irishrail@localhost:5432/irishrail_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"
      - name: Check formatting
        working-directory: infra
        run: terraform fmt -check -recursive
      - name: Initialize without backend
        working-directory: infra
        run: terraform init -backend=false
      - name: Validate configuration
        working-directory: infra
        run: terraform validate

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag irish-rail-tracker:ci .
